# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    paths-ignore:
      - ".github/**"
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - ".github/**"
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "Manual update"

jobs:
  build-combined:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if:
      github.ref_name == 'main' || github.ref_name == '1.21.1' || github.ref_name == '1.21.4' || github.ref_name == '1.21.8' || github.ref_name == '1.21.11'
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for gradlew for Fabric and NeoForge
        run: |
          chmod +x ./Fabric/gradlew
          chmod +x ./NeoForge/gradlew

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Fabric with Gradle
        working-directory: ./Fabric
        run: ./gradlew build

      - name: Build NeoForge with Gradle
        working-directory: ./NeoForge
        run: ./gradlew build

      - name: Publish Combined Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Prefab-Mods
          path: |
            ./Fabric/build/libs/prefab-fabric-*.jar
            ./NeoForge/build/libs/prefab-neoforge-*.jar

  build-forge-20:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: contains('refs/heads/1.20.6-Forge', github.ref)
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Package-Forge
          path: build/libs
